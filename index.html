<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="M&R Technoservice 22 LTD provides professional IT, security, and restaurant management solutions across the UK.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&R Technoservice 22 LTD | IT, Security & Restaurant Solutions</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #000;
    color: #e0e0e0;
    overflow-x: hidden;
}

/* NAVBAR */
.navbar {
    background-color: rgba(0,0,0,0.8);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    flex-wrap: wrap;
}
.nav-logo {
    color: white;
    font-weight: bold;
    border: 2px solid cyan;
    padding: 6px 12px;
    border-radius: 10px;
}
.nav-links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.nav-btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    background-color: rgba(0,0,0,0.8);
    color: white;
    border: 2px solid cyan;
    border-radius: 10px;
    padding: 6px 12px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}
.nav-btn:hover {
    background-color: cyan;
    color: black;
    transform: scale(1.05);
}
.nav-btn.active {
    border-color: yellow;
    box-shadow: 0 0 10px yellow;
}
.hamburger {
    display: none;
    font-size: 24px;
    cursor: pointer;
    color: white;
}

/* HEADER */
header#home {
    background-image: url('https://raw.githubusercontent.com/mrtechnoservice22/M-R-Technoservice-22-LTD/main/unv%20hikvivision%20Dahua%20sayt%20ucun%20sekil.png');
    background-position: center top;
    background-size: cover;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #FFD700;
    flex-direction: column;
}
header#home h1 {
    font-size: 2.5em;
    margin: 0;
    text-shadow: 0 0 10px black;
}
header#home p {
    font-size: 1.2em;
    margin-top: 10px;
    text-shadow: 0 0 6px black;
}

/* SECTIONS */
.page-section {
    display: none;
    padding: 120px 20px 50px;
}
.page-section.active {
    display: block;
}
.content-box {
    max-width: 1000px;
    margin: auto;
    background-color: rgba(0,20,20,0.7);
    padding: 30px;
    border-radius: 12px;
    font-size: 18px;
    line-height: 1.8;
}

/* PRODUCTS */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
    gap: 25px;
}
.product {
    background: #111;
    border-radius: 12px;
    padding: 10px;
    transition: 0.3s;
}
.product:hover {
    transform: translateY(-5px);
}
.product img {
    width: 100%;
    height: 210px;
    object-fit: contain;
}
.product h3 {
    text-align: center;
    margin: 10px 0 5px;
}
.product p {
    text-align: center;
    font-size: 14px;
    color: #ccc;
}

/* FLOAT BUTTONS */
.floating-buttons {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 999;
}
.whatsapp-btn, .email-btn {
    padding: 12px 18px;
    border-radius: 50px;
    color: white;
    text-decoration: none;
}
.whatsapp-btn { background: #25D366; }
.email-btn { background: #00c851; }

/* MOBILE */
@media (max-width: 768px) {
    .hamburger { display: block; }
    .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        margin-top: 10px;
    }
    .nav-links.show { display: flex; }
    .nav-btn { width: 100%; }
}
</style>
</head>

<body>

<div class="navbar">
    <div class="nav-logo">M&R Technoservice 22 LTD</div>
    <div class="hamburger"><i class="fas fa-bars"></i></div>
    <div class="nav-links">
        <button class="nav-btn active" data-section="home">Home</button>
        <button class="nav-btn" data-section="about">About</button>
        <button class="nav-btn" data-section="catalog">Products</button>
        <button class="nav-btn" data-section="services">Services</button>
        <button class="nav-btn" data-section="price">Price</button>
        <button class="nav-btn" data-section="certificates">Certificates</button>
        <button class="nav-btn" data-section="contact">Contact</button>
        <button class="nav-btn" data-section="terms">Terms & Conditions</button>
    </div>
</div>

<header id="home" class="page-section active">
    <h1>Welcome to Our IT, Restaurant & Security Solutions</h1>
    <p>Reliable products and professional support for your business</p>
</header>

<!-- Qalan bölmələr SƏN GÖNDƏRDİYİN KİMİ SAXLANIB -->

<script>
const buttons = document.querySelectorAll('.nav-btn');
const sections = document.querySelectorAll('.page-section');
const navLinks = document.querySelector('.nav-links');

buttons.forEach(btn => {
    btn.onclick = () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const id = btn.dataset.section;

        if (id === 'price') {
            window.open('M%26R%20TechnoService%2022%20LTD%20Hikvision%20price%20list.pdf.pdf');
            return;
        }
        if (id === 'certificates') {
            window.open('https://rawcdn.githack.com/rasim88ismayilov-hub/M-R-Technoservice-22-LTD/main/All%20certificate.pdf');
            return;
        }

        sections.forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');

        navLinks.classList.remove('show');
        window.scrollTo({top:0});
    };
});

document.querySelector('.hamburger').onclick = () => {
    navLinks.classList.toggle('show');
};
</script>

</body>
</html>
